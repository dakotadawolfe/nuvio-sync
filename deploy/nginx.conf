user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $uri $logged_uri {
        ~^/emby/play/ /emby/play/[redacted]/stream;
        ~^/stremio/[^/]+/(.*)$ /stremio/[profile]/$1;
        default $uri;
    }

    log_format main '$remote_addr [$time_local] "$request_method $logged_uri $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time upstream=$upstream_response_time '
                    '"$http_user_agent"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip off;
    etag on;
    if_modified_since exact;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    upstream nuvio_addon {
        zone nuvio_addon 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server aio-addon:3232 resolve;
        keepalive 16;
    }

    server {
        listen 3232;
        server_name _;

        location = /bleach {
            return 308 /bleach/;
        }

        location ^~ /bleach/ {
            alias /srv/nuvio-files/bleach/;
            autoindex off;
            disable_symlinks on;

            types {
                video/x-matroska mkv;
                application/x-subrip srt;
            }

            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                return 405;
            }

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Range, If-Range" always;
                add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, Content-Type, ETag, Last-Modified" always;
                add_header Cache-Control "public, max-age=86400, no-transform" always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Range, Content-Length, Content-Type, ETag, Last-Modified" always;
            add_header Cache-Control "public, max-age=86400, no-transform" always;
            add_header Content-Disposition "inline" always;
        }

        location / {
            proxy_pass http://nuvio_addon;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
