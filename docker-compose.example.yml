services:
  aio-addon:
    build: .
    container_name: aio-addon
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3232:3232"
    volumes:
      - ./data:/app/addon/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3232/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: aio-addon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 3600 1
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
